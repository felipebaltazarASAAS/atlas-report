<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Atlas Code Connect — Relatório</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --text-muted: #8b949e;
    --green: #3fb950; --yellow: #d29922; --red: #f85149; --blue: #58a6ff; --purple: #bc8cff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); padding: 24px; max-width: 1100px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 32px; }
  .header h1 { font-size: 28px; margin-bottom: 4px; }
  .header p { color: var(--text-muted); font-size: 14px; }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; }
  .card .number { font-size: 36px; font-weight: 700; }
  .card .label { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .card.blue .number { color: var(--blue); }
  .card.green .number { color: var(--green); }
  .card.red .number { color: var(--red); }
  .chart-section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 32px; }
  .chart-section h2 { font-size: 16px; margin-bottom: 16px; }
  .donut-container { display: flex; align-items: center; justify-content: center; gap: 40px; }
  .donut-wrapper { position: relative; width: 200px; height: 200px; }
  .donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
  .donut-center .pct { font-size: 32px; font-weight: 700; color: var(--green); }
  .donut-center .pct-label { font-size: 12px; color: var(--text-muted); }
  .legend { display: flex; flex-direction: column; gap: 10px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .bar-track { height: 24px; background: var(--border); border-radius: 12px; overflow: hidden; display: flex; margin-top: 12px; }
  .bar-seg { height: 100%; transition: width 0.6s ease; }
  .table-section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .table-section h2 { font-size: 16px; padding: 20px 20px 12px; }
  .filters { display: flex; gap: 8px; padding: 0 20px 16px; flex-wrap: wrap; }
  .filter-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text-muted); padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
  .filter-btn:hover, .filter-btn.active { border-color: var(--blue); color: var(--blue); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 10px 20px; font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
  td { padding: 10px 20px; font-size: 14px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  tr:hover { background: rgba(255,255,255,0.02); }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
  .badge.connected { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge.unmapped { background: rgba(139,148,158,0.15); color: var(--text-muted); }
  .figma-link { color: var(--blue); text-decoration: none; }
  .figma-link:hover { text-decoration: underline; }
  @media (max-width: 700px) { .summary { grid-template-columns: 1fr; } .donut-container { flex-direction: column; } }
</style>
</head>

<div class="chart-section">

const FILE_KEY = 'EpnFuPVWcjDYwkV2o2Vx3I';
const statusLabel = { connected: 'Conectado', unmapped: 'Não conectado' };
const statusColor = { connected: '#3fb950', unmapped: '#484f58' };

// Donut
const canvas = document.getElementById('donut');
const ctx = canvas.getContext('2d');
const counts = { connected: 31, unmapped: 53 };
let startAngle = -Math.PI / 2;
for (const [s, count] of Object.entries(counts)) {
  if (!count) continue;
  const sweep = (count / 84) * Math.PI * 2;
  ctx.beginPath(); ctx.arc(100, 100, 80, startAngle, startAngle + sweep);
  ctx.strokeStyle = statusColor[s]; ctx.lineWidth = 24; ctx.stroke();
  startAngle += sweep;
}

// Filters
const filtersEl = document.getElementById('filters');
let activeFilter = 'all';
[['all','Todos'],['connected','Conectado'],['unmapped','Não conectado']].forEach(([key, label]) => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn' + (key === 'all' ? ' active' : '');
  btn.textContent = label;
  btn.onclick = () => { activeFilter = key; document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); renderTable(); };
  filtersEl.appendChild(btn);
});

// Table
const tbody = document.getElementById('tbody');
function renderTable() {
  const filtered = activeFilter === 'all' ? DATA : DATA.filter(r => r.status === activeFilter);
  tbody.innerHTML = filtered.map(r => `<tr>
    <td>${r.name}</td>
    <td style="font-family:monospace;font-size:13px">${r.sourceUrl ? `<a class="figma-link" href="${r.sourceUrl}" target="_blank">${r.code}</a>` : `<span style="color:var(--text-muted)">${r.code}</span>`}</td>
    <td><span class="badge ${r.status}">${statusLabel[r.status]}</span></td>
    <td><a class="figma-link" href="https://www.figma.com/design/${FILE_KEY}/Atlas---Components?node-id=${r.nodeId.replace(':','-')}&m=dev" target="_blank">↗ Figma</a></td>
  </tr>`).join('');
}
renderTable();
</script>
